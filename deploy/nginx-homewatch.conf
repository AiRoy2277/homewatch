# HomeWatch 局域网面板
# 只监听内网地址，公网不可达；配合 nftables 的 8088 白名单形成双层限制。
server {
    listen 192.168.1.50:8088;
    server_name _;

    root /var/www/homewatch;
    index index.html;
    access_log /var/log/nginx/homewatch-access.log;

    # 管理接口：反代到本机 Unix socket。
    # 静态页面（看数据）不认证，只有改系统的动作要求登录 —— 这样日常查看不用输密码，
    # 而"关 SSH""改密码"这类操作必须过 basic auth。
    location /api/ {
        allow 127.0.0.1;
        allow 192.168.1.0/24;
        deny all;

        auth_basic "HomeWatch 管理";
        auth_basic_user_file /etc/nginx/.htpasswd.homewatch;

        proxy_pass http://unix:/run/homewatch/admin.sock;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        client_max_body_size 64k;
    }

    # 面板本体只读
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
    }
}
